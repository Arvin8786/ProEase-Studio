<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quranic Video Studio</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Arabic & English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-arabic { font-family: 'Amiri', serif; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const PEXELS_API_KEY = '6mKMhZrxXlna1oHIaFYheBlevUvQ3aPRXAvaqOmqGXbEj8s9PLmLnmX2';

      function App() {
        const [mode, setMode] = useState('shorts'); // 'shorts' (9:16) or 'recitation' (16:9)
        const [surahNum, setSurahNum] = useState(1);
        const [verses, setVerses] = useState([]);
        const [loadingVerses, setLoadingVerses] = useState(false);
        
        // Pexels Video State
        const [searchQuery, setSearchQuery] = useState('nature nature background');
        const [pexelsVideos, setPexelsVideos] = useState([]);
        const [selectedVideoUrl, setSelectedVideoUrl] = useState('');
        const [loadingVideos, setLoadingVideos] = useState(false);

        // Recording State
        const [isRecording, setIsRecording] = useState(false);
        const [recordedUrl, setRecordedUrl] = useState(null);

        const canvasRef = useRef(null);
        const videoRef = useRef(null);
        const mediaRecorderRef = useRef(null);

        // Canvas dimensions for 720p
        const canvasWidth = mode === 'shorts' ? 720 : 1280;
        const canvasHeight = mode === 'shorts' ? 1280 : 720;

        // 1. Fetch All Verses for Selected Surah
        useEffect(() => {
          async function fetchAllVerses() {
            setLoadingVerses(true);
            try {
              const [arabicRes, transRes] = await Promise.all([
                fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${surahNum}`),
                fetch(`https://api.quran.com/api/v4/quran/translations/131?chapter_number=${surahNum}`)
              ]);

              const arabicData = await arabicRes.json();
              const transData = await transRes.json();

              const combined = arabicData.verses.map((v, i) => ({
                id: v.id,
                verse_key: v.verse_key,
                text_uthmani: v.text_uthmani,
                translation: transData.translations[i]?.text.replace(/<[^>]+>/g, '') || ''
              }));

              setVerses(combined);
            } catch (err) {
              console.error('Failed to load Surah verses:', err);
            } finally {
              setLoadingVerses(false);
            }
          }

          fetchAllVerses();
        }, [surahNum]);

        // 2. Fetch Pexels Videos matching aspect ratio mode
        const fetchPexelsVideos = async () => {
          setLoadingVideos(true);
          try {
            const orientation = mode === 'shorts' ? 'portrait' : 'landscape';
            const res = await fetch(
              `https://api.pexels.com/videos/search?query=${encodeURIComponent(searchQuery)}&orientation=${orientation}&per_page=6`,
              { headers: { Authorization: PEXELS_API_KEY } }
            );
            const data = await res.json();
            
            if (data.videos && data.videos.length > 0) {
              setPexelsVideos(data.videos);
              // Pick 720p or highest matching resolution file
              const firstVideoFile = data.videos[0].video_files.find(f => f.height === 720 || f.width === 720) || data.videos[0].video_files[0];
              setSelectedVideoUrl(firstVideoFile.link);
            }
          } catch (err) {
            console.error('Error fetching Pexels videos:', err);
          } finally {
            setLoadingVideos(false);
          }
        };

        useEffect(() => {
          fetchPexelsVideos();
        }, [mode]);

        // 3. Render Canvas Loop (All Verses Overlay on Video)
        useEffect(() => {
          const canvas = canvasRef.current;
          const bgVideo = videoRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          let animationFrameId;

          const render = () => {
            // Draw background video if ready, else dark gradient fallback
            if (bgVideo && bgVideo.readyState >= 2) {
              ctx.drawImage(bgVideo, 0, 0, canvas.width, canvas.height);
            } else {
              const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
              grad.addColorStop(0, '#0f172a');
              grad.addColorStop(1, '#020617');
              ctx.fillStyle = grad;
              ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Dark semi-transparent overlay for text contrast
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (verses.length > 0) {
              ctx.fillStyle = '#ffffff';
              ctx.textAlign = 'center';

              if (mode === 'shorts') {
                // Portrait Mode Display
                ctx.font = 'bold 24px Inter, sans-serif';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`SURAH ${surahNum}`, canvas.width / 2, 100);

                let startY = 180;
                verses.forEach((v, idx) => {
                  if (startY > canvas.height - 100) return; // Canvas boundary check

                  // Verse Arabic
                  ctx.fillStyle = '#ffffff';
                  ctx.font = 'bold 32px Amiri, serif';
                  ctx.fillText(`${v.text_uthmani} ﴿${idx + 1}﴾`, canvas.width / 2, startY);
                  startY += 50;

                  // Verse Translation
                  ctx.fillStyle = '#cbd5e1';
                  ctx.font = '18px Inter, sans-serif';
                  ctx.fillText(v.translation, canvas.width / 2, startY);
                  startY += 70;
                });
              } else {
                // Landscape Mode Display (Recitation)
                ctx.font = 'bold 28px Inter, sans-serif';
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`SURAH ${surahNum}`, canvas.width / 2, 70);

                let startY = 140;
                verses.forEach((v, idx) => {
                  if (startY > canvas.height - 60) return;

                  ctx.fillStyle = '#ffffff';
                  ctx.font = 'bold 36px Amiri, serif';
                  ctx.fillText(`${v.text_uthmani} ﴿${idx + 1}﴾`, canvas.width / 2, startY);
                  startY += 55;

                  ctx.fillStyle = '#cbd5e1';
                  ctx.font = '20px Inter, sans-serif';
                  ctx.fillText(v.translation, canvas.width / 2, startY);
                  startY += 65;
                });
              }
            }

            animationFrameId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animationFrameId);
        }, [verses, surahNum, mode, selectedVideoUrl]);

        // 4. Instant In-Browser MediaRecorder Export
        const startRecording = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const stream = canvas.captureStream(60); // 60 FPS
          const chunks = [];

          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            setRecordedUrl(url);
            setIsRecording(false);
          };

          mediaRecorderRef.current = recorder;
          recorder.start();
          setIsRecording(true);
        };

        const stopRecording = () => {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
            mediaRecorderRef.current.stop();
          }
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 p-6 flex flex-col items-center">
            {/* Hidden video tag supplying background frames */}
            <video
              ref={videoRef}
              src={selectedVideoUrl}
              loop
              muted
              playsInline
              autoPlay
              crossOrigin="anonymous"
              className="hidden"
            />

            <header className="mb-6 text-center">
              <h1 className="text-3xl font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
                Quranic Video Studio
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Full Surah Display • Pexels Backgrounds • Direct 720p Download
              </p>
            </header>

            {/* Mode Selector */}
            <div className="flex gap-4 mb-6 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
              <button
                onClick={() => setMode('shorts')}
                className={`px-5 py-2 rounded-lg text-sm font-semibold transition ${
                  mode === 'shorts' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'
                }`}
              >
                Shorts (9:16 Portrait)
              </button>
              <button
                onClick={() => setMode('recitation')}
                className={`px-5 py-2 rounded-lg text-sm font-semibold transition ${
                  mode === 'recitation' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'
                }`}
              >
                Recitation (16:9 Landscape)
              </button>
            </div>

            <div className="flex flex-col lg:flex-row gap-8 items-start justify-center max-w-6xl w-full">
              {/* Left Control Panel */}
              <div className="w-full lg:w-96 bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col gap-5">
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Select Surah</label>
                  <select
                    value={surahNum}
                    onChange={(e) => setSurahNum(Number(e.target.value))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none"
                  >
                    <option value={1}>1. Al-Fatihah (7 Verses)</option>
                    <option value={36}>36. Ya-Sin</option>
                    <option value={55}>55. Ar-Rahman</option>
                    <option value={67}>67. Al-Mulk</option>
                    <option value={108}>108. Al-Kawthar (3 Verses)</option>
                    <option value={112}>112. Al-Ikhlas (4 Verses)</option>
                    <option value={113}>113. Al-Falaq (5 Verses)</option>
                    <option value={114}>114. An-Nas (6 Verses)</option>
                  </select>
                </div>

                {/* Pexels Background Picker */}
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Search Pexels Videos</label>
                  <div className="flex gap-2 mb-3">
                    <input
                      type="text"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      className="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-3 py-1.5 text-sm outline-none focus:border-sky-500"
                    />
                    <button
                      onClick={fetchPexelsVideos}
                      className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg"
                    >
                      Search
                    </button>
                  </div>

                  <div className="grid grid-cols-3 gap-2 max-h-36 overflow-y-auto pr-1">
                    {pexelsVideos.map((vid) => {
                      const file = vid.video_files.find(f => f.height === 720 || f.width === 720) || vid.video_files[0];
                      return (
                        <img
                          key={vid.id}
                          src={vid.image}
                          onClick={() => setSelectedVideoUrl(file.link)}
                          className={`w-full h-16 object-cover rounded-lg cursor-pointer border-2 transition ${
                            selectedVideoUrl === file.link ? 'border-sky-500 scale-95' : 'border-transparent opacity-70 hover:opacity-100'
                          }`}
                        />
                      );
                    })}
                  </div>
                </div>

                {/* Record and Export Controls */}
                <div className="pt-2 border-t border-slate-800 flex flex-col gap-3">
                  {!isRecording ? (
                    <button
                      onClick={startRecording}
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition shadow-lg flex items-center justify-center gap-2"
                    >
                      <span className="w-3 h-3 rounded-full bg-red-500"></span>
                      Start Recording 720p Video
                    </button>
                  ) : (
                    <button
                      onClick={stopRecording}
                      className="w-full py-3 bg-red-600 hover:bg-red-500 font-semibold rounded-xl transition shadow-lg animate-pulse"
                    >
                      Stop Recording
                    </button>
                  )}

                  {recordedUrl && (
                    <a
                      href={recordedUrl}
                      download={`Quran_${mode}_Surah_${surahNum}_720p.webm`}
                      className="w-full text-center py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl transition text-sm"
                    >
                      Download Ready Video
                    </a>
                  )}
                </div>
              </div>

              {/* Live 720p Canvas Preview */}
              <div className="flex flex-col items-center">
                <canvas
                  ref={canvasRef}
                  width={canvasWidth}
                  height={canvasHeight}
                  style={{
                    width: mode === 'shorts' ? '320px' : '568px',
                    height: mode === 'shorts' ? '568px' : '320px'
                  }}
                  className="rounded-2xl shadow-2xl border border-slate-800 bg-black"
                />
                <span className="text-xs text-slate-500 mt-2">
                  Live Preview • Output Native Resolution ({canvasWidth}x{canvasHeight}p)
                </span>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
