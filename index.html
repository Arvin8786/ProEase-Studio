<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quranic Reflections & Video Creator</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts for Arabic & Modern Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- React & Babel CDNs (Zero-install setup) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; }
      .font-arabic { font-family: 'Amiri', serif; }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      function App() {
        const [surahNum, setSurahNum] = useState(1);
        const [verses, setVerses] = useState([]);
        const [selectedVerseIndex, setSelectedVerseIndex] = useState(0);
        const [loading, setLoading] = useState(false);
        const [isRecording, setIsRecording] = useState(false);
        const [recordedUrl, setRecordedUrl] = useState(null);

        const canvasRef = useRef(null);
        const mediaRecorderRef = useRef(null);

        // Fetch Verses & Translations directly from Quran API
        useEffect(() => {
          async function fetchSurahData() {
            setLoading(true);
            try {
              const [arabicRes, transRes] = await Promise.all([
                fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${surahNum}`),
                fetch(`https://api.quran.com/api/v4/quran/translations/131?chapter_number=${surahNum}`)
              ]);

              const arabicData = await arabicRes.json();
              const transData = await transRes.json();

              const combined = arabicData.verses.map((v, i) => ({
                id: v.id,
                verse_key: v.verse_key,
                text_uthmani: v.text_uthmani,
                translation: transData.translations[i]?.text.replace(/<[^>]+>/g, '') || ''
              }));

              setVerses(combined);
              setSelectedVerseIndex(0);
            } catch (err) {
              console.error('Failed to fetch verses:', err);
            } finally {
              setLoading(false);
            }
          }

          fetchSurahData();
        }, [surahNum]);

        const currentVerse = verses[selectedVerseIndex] || {
          verse_key: '1:1',
          text_uthmani: 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ',
          translation: 'In the name of Allah, the Entirely Merciful, the Especially Merciful.'
        };

        // Continuous Canvas Renderer for 9:16 Shorts Video Frame
        useEffect(() => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const ctx = canvas.getContext('2d');
          let animationFrameId;

          const render = () => {
            // Background Gradient (1080x1920 Native Resolution)
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(0.5, '#1e1b4b');
            grad.addColorStop(1, '#020617');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Subtle Central Glow
            const glow = ctx.createRadialGradient(
              canvas.width / 2, canvas.height / 2, 50,
              canvas.width / 2, canvas.height / 2, 500
            );
            glow.addColorStop(0, 'rgba(99, 102, 241, 0.15)');
            glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dark Overlay Card Frame
            ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(100, 300, 880, 1320, 32);
            ctx.fill();
            ctx.stroke();

            // Badge Header
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 36px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(`SURAH ${surahNum} • VERSE ${currentVerse.verse_key}`, canvas.width / 2, 420);

            // Quran Arabic Text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 64px Amiri, serif';
            
            // Simple Word Wrap for Long Verses
            const words = currentVerse.text_uthmani.split(' ');
            let line = '';
            let y = 750;

            for (let n = 0; n < words.length; n++) {
              const testLine = line + words[n] + ' ';
              const metrics = ctx.measureText(testLine);
              if (metrics.width > 760 && n > 0) {
                ctx.fillText(line, canvas.width / 2, y);
                line = words[n] + ' ';
                y += 110;
              } else {
                line = testLine;
              }
            }
            ctx.fillText(line, canvas.width / 2, y);

            // English Translation Subtitle
            ctx.fillStyle = '#cbd5e1';
            ctx.font = '36px Inter, sans-serif';
            const transWords = currentVerse.translation.split(' ');
            let transLine = '';
            let transY = y + 140;

            for (let n = 0; n < transWords.length; n++) {
              const testLine = transLine + transWords[n] + ' ';
              const metrics = ctx.measureText(testLine);
              if (metrics.width > 760 && n > 0) {
                ctx.fillText(transLine, canvas.width / 2, transY);
                transLine = transWords[n] + ' ';
                transY += 60;
              } else {
                transLine = testLine;
              }
            }
            ctx.fillText(transLine, canvas.width / 2, transY);

            // Footer Watermark
            ctx.fillStyle = '#fbbf24';
            ctx.font = '28px Inter, sans-serif';
            ctx.fillText('Quranic Reflections Studio', canvas.width / 2, 1540);

            animationFrameId = requestAnimationFrame(render);
          };

          render();
          return () => cancelAnimationFrame(animationFrameId);
        }, [currentVerse, surahNum]);

        // Browser-Native Video Recording Logic
        const startRecording = () => {
          const canvas = canvasRef.current;
          if (!canvas) return;

          const stream = canvas.captureStream(60); // 60 FPS Video Stream
          const chunks = [];

          const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          recorder.ondataavailable = (e) => chunks.push(e.data);
          recorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            setRecordedUrl(url);
            setIsRecording(false);
          };

          mediaRecorderRef.current = recorder;
          recorder.start();
          setIsRecording(true);

          // Auto-stop after 10 seconds for standard short length
          setTimeout(() => {
            if (recorder.state === 'recording') {
              recorder.stop();
            }
          }, 10000);
        };

        const stopRecording = () => {
          if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
            mediaRecorderRef.current.stop();
          }
        };

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center p-6">
            <header className="mb-6 text-center">
              <h1 className="text-3xl font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
                Quranic Reflections Studio
              </h1>
              <p className="text-slate-400 text-sm mt-1">
                Create & Export 9:16 Shorts Directly in Your Browser
              </p>
            </header>

            <div className="flex flex-col lg:flex-row gap-8 items-center justify-center max-w-5xl w-full">
              {/* Controls Panel */}
              <div className="w-full lg:w-80 bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col gap-4">
                <h2 className="text-lg font-semibold border-b border-slate-800 pb-2">Video Settings</h2>

                <div>
                  <label className="text-xs text-slate-400 block mb-1">Select Surah</label>
                  <select
                    value={surahNum}
                    onChange={(e) => setSurahNum(Number(e.target.value))}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none"
                  >
                    <option value={1}>1. Al-Fatihah</option>
                    <option value={36}>36. Ya-Sin</option>
                    <option value={55}>55. Ar-Rahman</option>
                    <option value={67}>67. Al-Mulk</option>
                    <option value={112}>112. Al-Ikhlas</option>
                    <option value={113}>113. Al-Falaq</option>
                    <option value={114}>114. An-Nas</option>
                  </select>
                </div>

                <div>
                  <label className="text-xs text-slate-400 block mb-1">Select Verse</label>
                  <select
                    value={selectedVerseIndex}
                    onChange={(e) => setSelectedVerseIndex(Number(e.target.value))}
                    disabled={loading || verses.length === 0}
                    className="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-sm focus:border-sky-500 outline-none disabled:opacity-50"
                  >
                    {verses.map((v, idx) => (
                      <option key={v.id} value={idx}>
                        Verse {v.verse_key}
                      </option>
                    ))}
                  </select>
                </div>

                <div className="pt-2">
                  {!isRecording ? (
                    <button
                      onClick={startRecording}
                      className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-semibold rounded-xl transition shadow-lg flex items-center justify-center gap-2"
                    >
                      <span className="w-3 h-3 rounded-full bg-red-500"></span>
                      Record 10s Short
                    </button>
                  ) : (
                    <button
                      onClick={stopRecording}
                      className="w-full py-3 bg-red-600 hover:bg-red-500 font-semibold rounded-xl transition shadow-lg animate-pulse"
                    >
                      Recording... (Click to Stop)
                    </button>
                  )}
                </div>

                {recordedUrl && (
                  <div className="pt-2 border-t border-slate-800">
                    <a
                      href={recordedUrl}
                      download={`Quran_Short_${surahNum}_${currentVerse.verse_key}.webm`}
                      className="w-full block text-center py-2.5 bg-emerald-600 hover:bg-emerald-500 font-semibold rounded-xl transition text-sm"
                    >
                      Download Recorded Short
                    </a>
                  </div>
                )}
              </div>

              {/* Live Canvas Preview Frame */}
              <div className="flex flex-col items-center">
                <canvas
                  ref={canvasRef}
                  width={1080}
                  height={1920}
                  className="w-[320px] h-[568px] rounded-2xl shadow-2xl border border-slate-800"
                />
                <span className="text-xs text-slate-500 mt-2">
                  Live Preview • Canvas Scale (1080x1920 Resolution)
                </span>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
